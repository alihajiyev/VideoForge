appId: com.videoforge.desktop
productName: VideoForge
copyright: Copyright © 2026 VideoForge

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  # Uygulama/gorev cubugu ikonu (main.ts windowIconPath ile arar)
  - build/icon.ico
  - build/icon.png
  - package.json
  - '!**/*.map'

asar: true
compression: maximum
npmRebuild: false

# Electron dagitimi dogrudan node_modules/electron/dist klasorunden kopyalanir
# (antivirus kilitlerine takilan varsayilan zip akisini atlar).
electronDist: node_modules/electron/dist

win:
  # exe, pencere ve gorev cubugu ikonu (logo.ico -> build/icon.ico)
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Kurulum sihirbazi: kullanici klasor secebilir, masaustu + baslat menusu
  # kisayollari olusur, uygulama kurulum sonunda acilir.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: VideoForge
  runAfterFinish: true
  artifactName: 'VideoForge-Setup-${version}.${ext}'
  uninstallDisplayName: 'VideoForge ${version}'
  # Kaldirmada kullanici verisi (ayarlar, indirilen guncellemeler) SILINMEZ.
  deleteAppDataOnUninstall: false
  # Sihirbazin her adiminda ayni logo
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

portable:
  artifactName: 'VideoForge-${version}-portable.${ext}'

publish: null
