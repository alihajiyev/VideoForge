appId: com.videoforge.desktop
productName: VideoForge
copyright: Copyright © 2026 VideoForge

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  # Uygulama/gorev cubugu ikonu (main.ts windowIconPath ile arar)
  - build/icon.ico
  - build/icon.png
  - package.json
  - '!**/*.map'

asar: true
compression: maximum
npmRebuild: false

# Electron dagitimi dogrudan node_modules/electron/dist klasorunden kopyalanir
# (antivirus kilitlerine takilan varsayilan zip akisini atlar).
electronDist: node_modules/electron/dist

win:
  # exe, pencere ve gorev cubugu ikonu (logo.ico -> build/icon.ico)
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Tek tikla kurulum (sihirbaz YOK). Boylece electron-updater guncellemeyi de
  # sessizce kurup uygulamayi yeniden baslatir; kullanici setup sihirbazi gormez.
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: VideoForge
  runAfterFinish: true
  artifactName: 'VideoForge-Setup-${version}.${ext}'
  uninstallDisplayName: 'VideoForge ${version}'
  # one-click kurulumda kaldirmada kullanici verisi (ayarlar) SILINMEZ.
  deleteAppDataOnUninstall: false
  # Kurulum/kaldirma ikonlari
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

portable:
  artifactName: 'VideoForge-${version}-portable.${ext}'

# Uygulama ici otomatik guncelleme (electron-updater) bu bilgiyle resources/
# app-update.yml dosyasini uretir; latest.yml de derleme cikisina yazilir.
# Yukleme yine scripts/release.mjs ile yapilir (--publish never).
publish:
  provider: github
  owner: alihajiyev
  repo: VideoForge
